              - text: "\"token = \"remote-token\" # required; remote daemon auth_tokenFor a host you reach with ssh, with no agentsview running there:[[remote_hosts]]host = \"devbox2\"transport = \"ssh\"destination = \""
              - link "user@devbox.example.com" [ref=f1e1292] [cursor=pointer]:
