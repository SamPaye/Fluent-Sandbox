            - paragraph [ref=f1e1270]: Syncs session data from supported AI coding agents into SQLite,serves analytics, and exposes a session browser via local web UI.
            - paragraph [ref=f1e1271]: Usage:agentsview [flags]agentsview <command> [flags]
            - paragraph [ref=f1e1272]: "Agent quick start:"
            - list [ref=f1e1273]:
              - listitem [ref=f1e1274]: Discover supported agents and their default source locations:agentsview source list --json
              - listitem [ref=f1e1275]: Refresh the local archive (the background daemon also watches sources):agentsview source sync
              - listitem [ref=f1e1276]: Find recent sessions and copy a full ID from the result:agentsview session list --since 7d --limit 20 --json
              - listitem [ref=f1e1277]: Inspect metadata, then a bounded transcript window:agentsview session get <id> --jsonagentsview session messages <id> --around 40 --before 5 --after 5 --jsonSearch and reports:agentsview session search 'connection reset' --since 14d --jsonagentsview session usage <id> --jsonagentsview report stats --since 28d --jsonagentsview report usage daily --since 28d --json
            - paragraph [ref=f1e1278]: Session IDs:Treat IDs as opaque strings.Claude IDs are commonly bare UUIDs; other agents use forms such as codex:<id>.Remote-synced IDs may be host~codex:<id>. Several read commands retry bareprovider IDs with known agent prefixes; a full ID avoids choosing a differentprovider's session. Metadata IDs, transcript ordinals, and pagination cursorsare different values. Use the corresponding response cursor. For sessionlist, repeat the backend, filters, and sort on every page; its cursor doesnot store the filter selection.
            - paragraph [ref=f1e1279]: Where data comes from:SQLite under the data directory is the persistent local archive. Normal localreads use a discovered daemon, starting one in the background when permitted.Discovery prefers a writable daemon; if only a compatible read-only mirrorserver is available, supported reads can use that server.On the session group, --server URL selects a remote daemon and --pg selectsconfigured PostgreSQL; these options are mutually exclusive. Remote auth uses--server-token-file or AGENTSVIEW_SERVER_TOKEN. These are command/group flags,not root flags. Read-only mirrors cannot refresh local provider sources.AGENTSVIEW_NO_DAEMON=1 prevents automatic startup and replacement. Ordinarylocal reads then need a running daemon; explicit offline and maintenancecommands retain their documented local paths. Manage the writable daemon with:agentsview daemon statusagentsview daemon startsource list reports built-in defaults and environment override names, notconfigured paths.
            - paragraph [ref=f1e1280]: "Output:Human output is the default. Where offered, --json aliases --format json.Successful reports go to stdout; diagnostics, warnings, and errors go tostderr. Progress is command-specific: source sync human progress also uses stdout;most other progress uses stderr.Human failures use fatal: followed by hint: on stderr. JSON-selected failuresuse a flat stderr document: {\"error\":\"validation\",\"message\":\"...\",\"hint\":\"...\"}.JSON selection follows each command's flags; there is no root --json flag.session watch emits NDJSON events; session export emits provider-specificsource content (Markdown, JSON, JSONL, or file bytes).Their --format/--json flags are rejected."
            - paragraph [ref=f1e1281]: "Exit codes:0 Success. usage-batch keeps each ID's status in its result document.1 General failure; ordinary session lookups also use this when not found.2 session usage/token-use: session not found; source raw backfill: failed batch.3 session usage/token-use: report has no token, cost, or plan figures;data-version check: archive requires a newer binary.4 Export cursor reset or reconciliation required.5 Conversation revision changed during export.64 Invalid command usage, such as bad flags, arguments, or flag conflicts.65 Invalid values, including malformed time windows and sort selections.69 A required service or capability is unavailable.70 Capture report failure. capture run preserves the producer's exit code.No-data 3 is silent after its report. Explicit command and child-processcodes take precedence."
            - paragraph [ref=f1e1282]: Choose a command below, then use agentsview <command> --help for flags, limits, and examples.Core Commands:daemon Manage the background serverproject Browse projects in the archiveserve Start the web UI and sync serversource Discover and ingest session sources
            - paragraph [ref=f1e1283]: Data Commands:archive Retain original session files, reparse them, and move a complete archivedb Maintain the local archiveexport Export local archive datafriction Build and read the Friction Log (heuristic session review)index Build and manage derived search indexesinsight Generate and inspect stored Activity Insightskata Inspect the optional Kata issue-tracker connectionmcp Run an MCP server exposing read-only session retrieval toolsrecall Build and inspect recalled knowledge from past sessionsreplica Sync and serve database replicassecrets Scan for and list detected secret leakssession Programmatic access to session datawhy Find recorded sessions and prompts behind file lines or a commit
            - paragraph [ref=f1e1284]: Usage Commands:capture Capture one non-interactive agent executionreport Report activity, usage, and workspace statistics
            - paragraph [ref=f1e1285]: Other Commands:cli Discover commands for a taskcompletion Generate the autocompletion script for the specified shelldoctor Collect support diagnosticsmemory Manage conversation-memory integrationopenapi Print OpenAPI 3.1 schemaskills Install and list AgentsView skills for coding-agent harnessesupdate Check for and install updatesversion Show version information
            - paragraph [ref=f1e1286]: "Flags:-h, --help help for agentsview-v, --version Show version informationEnvironment variables:CLAUDE_PROJECTS_DIR Claude Code projects directoryCODEX_SESSIONS_DIR Codex sessions directoryCOPILOT_DIR Copilot sessions or exported JetBrains Copilot directoryGEMINI_DIR Gemini CLI directoryOPENCODE_DIR OpenCode data directoryCLINE_DIR Cline sessions directoryCURSOR_PROJECTS_DIR Cursor projects directoryIFLOW_DIR iFlow projects directoryFX_SESSIONS_DIR fx sessions directoryJUNIE_DIR Junie sessions directoryJUNIE_HOME Junie home (re-roots sessions directory)AMP_DIR Amp threads directoryZED_DIR Zed data directoryQWEN_PROJECTS_DIR Qwen Code projects directoryQWENPAW_DIR QwenPaw workspaces directoryOMO_DIR OMO sessions directorySTEPCODE_DIR StepCode sessions directoryOMP_DIR OhMyPi sessions directoryMUSE_SESSIONS_DIR Muse Code sessions directoryDEEPSEEK_TUI_SESSIONS_DIRDeepSeek TUI sessions directoryDEEPSEEK_HARNESS_SESSIONS_DIRDeepSeek Harness sessions directoryDSH_HOME DeepSeek Harness home directoryQCLAW_DIR QClaw agents directoryWORKBUDDY_PROJECTS_DIR WorkBuddy projects directoryCODEBUDDY_DIR CodeBuddy data directoryPIEBALD_DIR Piebald data directoryAGENTSVIEW_DATA_DIR Data directory (database, config)AGENTSVIEW_AUTH_TOKEN Bearer token for the local daemon and its clientsAGENTSVIEW_MODE Deployment default: serve or pg-serveAGENTSVIEW_AUTH_TOKEN_FILEDaemon token file in deployment modeAGENTSVIEW_HOST, AGENTSVIEW_REQUIRE_AUTH, AGENTSVIEW_NO_BROWSERListener defaults when AGENTSVIEW_MODE is setAGENTSVIEW_PG_URL PostgreSQL connection URL for syncAGENTSVIEW_PG_MACHINE Machine name for PG syncAGENTSVIEW_PG_SCHEMA PG schema name (default \"agentsview\")AGENTSVIEW_DUCKDB_PATH DuckDB mirror database pathAGENTSVIEW_DUCKDB_URL Quack connection URL for DuckDB serveAGENTSVIEW_DUCKDB_TOKEN Quack authentication tokenAGENTSVIEW_DUCKDB_MACHINEMachine name for DuckDB sync"
            - paragraph [ref=f1e1287]: Watcher excludes:Add "watch_exclude_patterns" to ~/.agentsview/config.tomlto skip directory names/patterns while recursively watching roots.Example:watch_exclude_patterns = [".git", "node_modules", ".next", "dist"]
            - paragraph [ref=f1e1288]: Session cwd filter:Add "sync_include_cwd_prefixes" to ~/.agentsview/config.toml toingest only sessions whose working directory is under one of thelisted paths. Sessions without a recorded cwd are skipped whilethe filter is set. Applies to local sync only. Example:sync_include_cwd_prefixes = ["/home/me/work"]
            - paragraph [ref=f1e1289]: Multiple directories:Add arrays to ~/.agentsview/config.toml to scan multiple locations:[agents.claude]dirs = ["/path/one", "/path/two"][agents.codex]dirs = ["/codex/a", "/codex/b"]When set, these override default directories. Environment variablesoverride config file arrays.
            - paragraph [ref=f1e1290]:
              - text: Remote hosts:Add a [[remote_hosts]] array to ~/.agentsview/config.toml so that"agentsview source sync" (no --host) also syncs each configured host:For daemon-backed HTTP sync over a private network such as Tailscale:[[remote_hosts]]host = "devbox1"transport = "http"url = "
