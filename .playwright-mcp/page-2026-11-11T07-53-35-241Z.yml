            - paragraph [ref=f3e1289]: Top-level daemon_idle_timeout applies to automatically started and serve --background daemons;"0s" keeps them alive. daemon start and daemon restart stay running until stopped.Top-level sync_idle_after = "10m" pauses local collection while idle; "0" disables the pause.
            - paragraph [ref=f3e1290]: Data stored in ~/.agentsview/ by default.PS C:\Users\Bomb Studio\Desktop\Fluent Sandbox> & "$env:USERPROFILE.agentsview\bin\agentsview.exe" serve --helpStart the web UI, API, and session sync in one server process.
            - paragraph [ref=f3e1291]:
              - text: Runs in the foreground unless --background is set.
              - code [ref=f3e1292]: agentsview daemon start
              - text: starts this same server in the background using saved configuration.If a compatible server is already running, serve reports its URL and exitswith status 1 so a service manager retries; --background exits with status 0.Stopping the server also stops its background sync and file watchers.
            - paragraph [ref=f3e1293]: Usage:agentsview serve [flags]agentsview serve [command]
            - paragraph [ref=f3e1294]: Examples:agentsview serve --no-browseragentsview serve --background
            - paragraph [ref=f3e1295]: Available Commands:restart Restart the writable SQLite background daemonstatus Show whether a server is running and where to reach itstop Stop the server, including sync and file watchers
            - paragraph [ref=f3e1296]: "Flags:--allowed-subnet stringList Client CIDR allowed to connect to the managed proxy (repeatable or comma-separated)--background Start server in the background and return to the shell--base-path string URL prefix for reverse-proxy subpath (e.g. /agentsview)--caddy-bin string Caddy binary to use when -proxy=caddy (default: caddy)--events-coalesce-interval duration Minimum interval between SSE data_changed broadcasts (0 disables coalescing) (default 10s)-h, --help help for serve--host string Interface/IP for the backend HTTP server to bind (default \"127.0.0.1\")--no-browser Don't open browser on startup--no-sync Skip initial sync and disable background sync/file watching--no-update-check Disable the update check API endpoint--port int Backend HTTP port; an explicit nonzero port must be available (0 selects an available port) (default 8080)--proxy string Managed reverse proxy mode (currently: caddy)--proxy-bind-host string Local interface/IP for managed Caddy to bind (default: 127.0.0.1)--public-origin stringList Trusted origin for Host/Origin checks; does not change the browser URL (repeatable or comma-separated)--public-port int Managed Caddy HTTP/HTTPS listener port; also sets the public URL port (default: URL port or 8443)--public-url string Browser URL, also added to trusted origins; does not bind a listener--replace Replace a running local daemon before starting--require-auth Require a bearer token for all API requests--tls-cert string TLS certificate path for managed Caddy HTTPS mode--tls-key string TLS key path for managed Caddy HTTPS mode--write-timeout duration Max time to write an API response before a 503 request-timed-out; raise for slow aggregates over large datasets (0 disables) (default 30s)"
